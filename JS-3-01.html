<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>JS excercise</title>
  </head>
  <body>
    <h1>JS_3_1</h1>
    <p id="names_list"></p>
    <p id="changed_names"></p>
    <p id="last_char"></p>
    <p id="first_char"></p>
    
  </body>


<script>

const names = []

for (let i = 0; i < 5; i++) {
    name = prompt("Type your name: ")
    names.push(name)

}

let list = document.querySelector("#names_list")
list.textContent = `Names: ${names}`

let last = document.querySelector("#last_char")
last.textContent = `Last character: ${names[4]}`

let first = document.querySelector("#first_char")
first.textContent = `First character: ${names[0]}`


names.shift()

let changed_text = document.querySelector("#changed_names")
changed_text.textContent = `Changed names: ${names}`

    </script>






</html>
